services:
  - type: web
    name: ssdt-web
    runtime: docker
    repo: https://github.com/Syahrulnalli/SSDT
    branch: main
    autoDeployTrigger: commit
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health/database
    envVars:
      - key: APP_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: DEMO_USERNAME
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: DEMO_STUDENT_NAME
        value: Syahrul Nalli
      - key: DEMO_STUDENT_EMAIL
        value: demo@example.com
      - key: DEMO_STUDENT_PROGRAM
        value: BCA (AI/ML)
      - key: DEMO_STUDENT_BATCH
        value: Demo
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: AUTH_COOKIE_NAME
        value: ssdt_session
